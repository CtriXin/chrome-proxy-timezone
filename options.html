<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Atlas Proxy Settings</title>
  <link rel="stylesheet" href="options.css">
</head>
<body class="dark">
  <div class="layout">
    <aside class="sidebar">
      <div class="sidebar-header">
        <span class="logo">◈ Atlas Proxy</span>
        <span class="sub">Settings</span>
      </div>
      <nav class="sidebar-nav">
        <div class="nav-group-title" data-i18n="tabQuick">PROXIES</div>
        <div id="profileList" class="profile-list"></div>
        <button id="newProfileBtn" class="btn-new-node" data-i18n="btnNewProfile">+ Add Profile</button>
        <div class="nav-divider"></div>
        <div class="nav-group-title">SYSTEM</div>
        <button class="nav-menu-item active" data-section="section-node">
          <span class="icon">🔒</span> <span data-i18n="labelProfileInfo">Node Detail</span>
        </button>
        <button class="nav-menu-item" data-section="section-rules">
          <span class="icon">🔀</span> <span data-i18n="statusAuto">Routing Rules</span>
        </button>
        <button class="nav-menu-item" data-section="section-general">
          <span class="icon">🌍</span> <span data-i18n="labelGlobalSettings">Preferences</span>
        </button>
        <button class="nav-menu-item" data-section="section-backup">
          <span class="icon">💾</span> <span data-i18n="btnImport">Backup & Sync</span>
        </button>
      </nav>
    </aside>

    <main class="main-content">
      <header class="top-bar">
        <div class="mode-selector">
          <label data-i18n="labelMode">Mode</label>
          <select id="proxyMode">
            <option value="system" data-i18n="statusSystem">System</option>
            <option value="direct" data-i18n="statusDirect">Direct</option>
            <option value="manual" data-i18n="statusManual">Manual</option>
            <option value="auto" data-i18n="statusAuto">Auto</option>
          </select>
        </div>
        <div class="mode-selector" id="activeGroup">
          <label data-i18n="labelProfile">Active</label>
          <select id="activeProfile"></select>
        </div>
        <div class="spacer"></div>
        <div class="toolbar">
          <button id="uiLangToggle" class="btn-tool">中 / En</button>
          <button id="themeBtn" class="theme-toggle">☀️</button>
          <button id="saveTopBtn" class="btn-primary" data-i18n="btnSaveApply">Apply</button>
        </div>
      </header>

      <div class="content-container">
        <!-- Section: Node -->
        <section id="section-node" class="config-section active">
          <h2 data-i18n="labelProfileInfo">Node Details</h2>
          <div class="card">
            <div class="field"><label data-i18n="labelAlias">Alias</label><input type="text" id="pName"></div>
            <div class="grid-3">
              <div class="field"><label data-i18n="labelProtocol">Protocol</label><select id="pScheme"><option value="http">HTTP</option><option value="https">HTTPS</option><option value="socks5">SOCKS5</option></select></div>
              <div class="field"><label data-i18n="labelHost">Host</label><input type="text" id="pHost"></div>
              <div class="field"><label data-i18n="labelPort">Port</label><input type="text" id="pPort"></div>
            </div>
            <div class="grid-2">
              <div class="field"><label data-i18n="labelUser">User</label><input type="text" id="pUser"></div>
              <div class="field"><label data-i18n="labelPass">Pass</label><input type="password" id="pPass"></div>
            </div>
            <div class="btn-row">
              <button id="testNodeBtn" class="btn-test">⚡ Test Connection</button>
              <button id="pasteBtn" class="btn-ghost" data-i18n="btnPaste">Paste</button>
              <button id="updateProfileBtn" class="btn-ghost" data-i18n="btnUpdate">Update</button>
              <button id="delProfileBtn" class="btn-ghost danger" data-i18n="btnDelete">Delete</button>
            </div>
          </div>
        </section>

        <!-- Section: Rules -->
        <section id="section-rules" class="config-section">
          <h2 data-i18n="statusAuto">Auto Routing Rules</h2>
          <div class="card">
            <div id="ruleList" class="rule-list"></div>
            <div class="grid-2" style="margin-top:16px"><input type="text" id="rulePattern" placeholder="*.google.com"><select id="ruleProfile"></select></div>
            <button id="addRuleBtn" class="btn-ghost" data-i18n="btnAddRule" style="margin-top:12px">+ Add Rule</button>
          </div>
          <div class="card" style="margin-top:20px">
            <div class="field"><label data-i18n="labelBypass">Bypass List</label><input type="text" id="proxyBypass"></div>
          </div>
        </section>

        <!-- Section: General -->
        <section id="section-general" class="config-section">
          <h2 data-i18n="labelGlobalSettings">Global Preferences</h2>
          <div class="card">
            <div class="field"><label>API Worker URL</label><input type="text" id="apiBase"></div>
            <div class="field">
              <label data-i18n="labelTz">Timezone</label>
              <select id="timezone">
                <option value="" data-i18n="optDefault">Default</option>
                <option value="ip" data-i18n="optIpLocation">Follow IP</option>
                <optgroup label="Asia"><option value="Asia/Singapore">Singapore</option><option value="Asia/Shanghai">Shanghai/Beijing</option></optgroup>
                <optgroup label="Americas"><option value="America/New_York">New York</option><option value="America/Phoenix">Phoenix</option></optgroup>
              </select>
            </div>
            <div class="field">
              <label data-i18n="labelLang">Language</label>
              <select id="language">
                <option value="" data-i18n="optDefault">Default</option>
                <option value="zh-CN">简体中文</option><option value="en-US">English</option>
              </select>
            </div>
          </div>
        </section>

        <!-- Section: Backup -->
        <section id="section-backup" class="config-section">
          <h2>Backup & Restore</h2>
          <div class="card">
            <div class="btn-row">
              <button id="exportBtn" class="btn-ghost" data-i18n="btnExport">Export JSON</button>
              <button id="importBtn" class="btn-ghost" data-i18n="btnImport">Import JSON</button>
              <input type="file" id="importFile" style="display:none">
            </div>
          </div>
        </section>
      </div>
    </main>
  </div>
  <script src="options.js"></script>
</body>
</html>
