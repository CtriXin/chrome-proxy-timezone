<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Atlas 网络诊断中心</title>
  <script src="theme-boot.js"></script>
  <link rel="stylesheet" href="report.css">
</head>
<body>
  <div class="shell">
    <header class="topbar panel">
      <div class="topbar-copy">
        <div id="logoEyebrow" class="eyebrow">ATLAS PROXY</div>        <h1 id="reportTitle">Atlas 网络诊断中心</h1>
        <p id="reportSubtitle" class="subtitle">一个页面看完出口 IP、Claude 可达性、DNS、WebRTC、设备指纹与修复建议。</p>
      </div>
      <div class="toolbar">
        <button id="uiLangToggle" class="tool-btn">中/En</button>
        <button id="themeToggle" class="tool-btn">☀️</button>
        <button id="exportJsonBtn" class="tool-btn wide">导出 JSON</button>
        <button id="openOptionsBtn" class="tool-btn wide">设置</button>
      </div>
    </header>

    <nav class="route-nav panel">
      <button class="route-link active" data-section="heroCard">总览</button>
      <button class="route-link" data-section="riskCard">风险</button>
      <button class="route-link" data-section="claudeCard">Claude</button>
      <button class="route-link" data-section="privacyCard">DNS / WebRTC</button>
      <button class="route-link" data-section="deviceCard">设备</button>
      <button class="route-link" data-section="networkCard">状态</button>
    </nav>

    <main class="content">
      <section id="heroCard" class="hero panel">
        <div class="hero-main">
          <div class="hero-label" id="overviewLabel">当前出口 IP</div>
          <div id="heroIp" class="hero-ip">--</div>
          <div id="heroGeo" class="hero-geo">--</div>
        </div>
        <div class="hero-side">
          <div id="heroBadge" class="hero-badge">--</div>
          <div id="heroMeta" class="hero-meta">--</div>
          <p id="heroNote" class="hero-note">--</p>
          <div class="hero-actions">
            <button id="refreshLightBtn" class="ghost-btn">刷新快照</button>
            <button id="refreshFullBtn" class="primary-btn">重新扫描</button>
          </div>
        </div>
      </section>

      <section class="grid two">
        <article id="overviewCard" class="card panel">
          <div class="card-head"><h2 id="overviewHeading">总览</h2></div>
          <div id="overviewRows" class="rows"></div>
        </article>
        <article id="riskCard" class="card panel">
          <div class="card-head"><h2 id="riskHeading">风险与身份</h2></div>
          <div class="risk-layout">
            <div class="score-wrap">
              <div class="score-ring">
                <svg viewBox="0 0 120 120">
                  <circle class="score-bg" cx="60" cy="60" r="52"></circle>
                  <circle id="scoreCircle" class="score-fg" cx="60" cy="60" r="52"></circle>
                </svg>
                <div class="score-center"><span id="scoreValue">--</span><small>/100</small></div>
              </div>
              <div id="scoreLabel" class="score-label">--</div>
            </div>
            <div id="riskRows" class="rows compact"></div>
          </div>
          <div id="riskBadges" class="badge-cloud"></div>
        </article>
      </section>

      <section class="grid two">
        <article id="claudeCard" class="card panel">
          <div class="card-head"><h2 id="claudeHeading">Claude Safe Reachability</h2></div>
          <div id="claudeRows" class="rows"></div>
          <div class="info-note" id="safeProbeNote">Only public pages and static assets are probed. No prompt, cookie, or session payload is sent.</div>
        </article>
        <article id="networkCard" class="card panel">
          <div class="card-head"><h2 id="networkHeading">网络状态</h2></div>
          <div id="networkRows" class="rows"></div>
        </article>
      </section>

      <section class="grid two">
        <article id="privacyCard" class="card panel">
          <div class="card-head"><h2 id="privacyHeading">DNS / WebRTC</h2></div>
          <div id="privacyRows" class="rows"></div>
        </article>
        <article id="deviceCard" class="card panel">
          <div class="card-head"><h2 id="deviceHeading">设备与指纹</h2></div>
          <div id="deviceRows" class="rows"></div>
        </article>
      </section>

      <section class="grid one">
        <article class="card panel">
          <div class="card-head"><h2 id="recommendHeading">修复建议</h2></div>
          <div id="recommendRows" class="tips"></div>
        </article>
      </section>
    </main>
  </div>
  <script src="report.js"></script>
</body>
</html>
